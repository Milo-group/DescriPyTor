services:
  descripytor-gui:
    build:
      context: .
      dockerfile: Getting_started_with_examples/descriptor_extraction_toolkit/webapp/Dockerfile
    image: descripytor-webapp:latest
    ports:
      - "${DESCRIPYTOR_GUI_PORT:-7432}:7432"
    environment:
      DESCRIPYTOR_ROOT: /workspace/descripytor
      PYTHONPATH: /workspace/descripytor:/workspace/descripytor/Getting_started_with_examples/descriptor_extraction_toolkit
      GUI_HOST: 0.0.0.0
      GUI_PORT: "7432"
      OMP_NUM_THREADS: "${DESCRIPYTOR_CPU_THREADS:-4}"
      MKL_NUM_THREADS: "${DESCRIPYTOR_CPU_THREADS:-4}"
      OPENBLAS_NUM_THREADS: "${DESCRIPYTOR_CPU_THREADS:-4}"
    volumes:
      - .:/workspace/descripytor
      - ./work:/work
    working_dir: /workspace/descripytor
    command: /opt/conda/bin/python M2_data_extractor/gui_server.py
    healthcheck:
      test:
        [
          "CMD",
          "/opt/conda/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7432/status', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  descripytor-webapp:
    build:
      context: .
      dockerfile: Getting_started_with_examples/descriptor_extraction_toolkit/webapp/Dockerfile
    image: descripytor-webapp:latest
    ports:
      - "${DESCRIPYTOR_HOST_PORT:-8503}:8501"
    environment:
      DESCRIPYTOR_ROOT: /workspace/descripytor
      PYTHONPATH: /workspace/descripytor:/workspace/descripytor/Getting_started_with_examples/descriptor_extraction_toolkit
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      XTBPATH: /opt/conda/share/xtb
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - .:/workspace/descripytor
      - ./work:/work
      - descripytor-streamlit-cache:/home/mambauser/.streamlit
    working_dir: /workspace/descripytor/Getting_started_with_examples/descriptor_extraction_toolkit/webapp
    command: /opt/conda/bin/streamlit run app.py
    stdin_open: true
    tty: true

volumes:
  descripytor-streamlit-cache:
