name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scipy scikit-learn statsmodels \
            matplotlib seaborn joblib tqdm pillow flask
      - name: Fast tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -m "not slow" --tb=short -q
