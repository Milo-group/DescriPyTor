name: descripytor-webapp
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - tk           # M3_modeler/modeling.py does `from tkinter import filedialog, messagebox`
                 # at import time - without this, importing it (Modeling tab) crashes.
  - streamlit>=1.30
  - flask
  - flask-cors
  - pandas
  - pyarrow
  - numpy<2
  - scipy
  - scikit-learn
  - matplotlib
  - pillow
  - plotly
  - tqdm
  - joblib
  - statsmodels
  - seaborn
  - psutil
  - pymc
  - arviz
  - networkx
  - umap-learn    # Results tab: PCA/UMAP scatter of the merged feature set
  - dash
  - ipywidgets
  - chardet
  - py3dmol
  - rdkit
  - ase
  - morfeus-ml
  - xtb
  - crest
  # NOTE: no torch/pytorch here on purpose. MolAlign.renumbering (the only
  # thing in this toolkit that needs it, via RDKIT_utils/df_funs/rotations)
  # is only imported lazily inside data_extractor.py's get_renumbering_dict(),
  # which nothing in the webapp calls - so feather loading etc. don't need
  # torch at all. Add "pytorch-cpu" here only if you specifically need
  # get_renumbering_dict()'s xyz-renumbering feature.
  - pip:
      - bassa-reg
      - aqme
      - mordred
