[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "descripytor"
version = "0.3.4"
description = "Molecular feature extraction, alignment, and modeling tools."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eden Specktor", email = "edenspec@post.bgu.ac.il" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# numpy<2 is required: the RDKit and PyArrow builds used here fail against 2.x.
dependencies = [
    "numpy<2",
    "pandas",
    "pyarrow<26",                 # 26 needs NumPy 2
    "scipy",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "plotly",
    "adjustText",
    "tqdm",
    "joblib",
    "psutil",
    "chardet",
    "networkx",
    "rdkit",
    "morfeus-ml",
    "pillow",
    "flask",
    "flask-cors",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7", "ruff>=0.5", "twine>=5"]
# Atom renumbering (descripytor renumber, Molecules.get_renumbering_dict, the visual extractor's Align & renumber)
# also needs Conformaty, which is not on PyPI yet: pip install git+https://github.com/Milo-group/Conformaty
align = ["torch"]
# Extra descriptor engines in the extraction toolkit
engines = ["mordred", "deepchem", "ase"]
# The sampler behind `descripytor bassa_explorer` (new tables); the corrected core comes with the package
bassa = ["bassa-reg>=0.1.16"]
# Spike-and-slab / Bayesian extras in M3
bayes = ["pymc", "arviz"]
# SHAP explanations in model reports
explain = ["shap"]
# Jupyter notebooks
notebook = ["ipywidgets", "ipykernel", "dash"]

[project.scripts]
descripytor = "descripytor.cli:main"

[project.urls]
Homepage = "https://github.com/Milo-group/DescriPyTor"
Repository = "https://github.com/Milo-group/DescriPyTor"

[tool.setuptools]
include-package-data = true

# The package now lives at the repository root, so name the packages
# explicitly rather than globbing - otherwise the example and doc folders
# get swept into the distribution.
[tool.setuptools.packages.find]
include = [
    "descripytor*",
    "M1_pre_calculations*",
    "M2_data_extractor*",
    "M3_modeler*",
    "utils*",
]
exclude = ["runs*", "work*", "docs*", "Getting_started_with_examples*", "tests*"]

[tool.setuptools.package-data]
"M2_data_extractor" = ["*.html", "static/*", "static/align_guide/*.svg", "static/align_guide/guide.json"]
# the feature explorer (Sterimol / theta / cone / %Vbur / dipoles / charges), `descripytor feature_explorer`
"M2_data_extractor.feature_explorer" = ["*.js", "*.html", "*.json", "fixtures/*", "rdkit/*"]
# the folder name before the rename: forwarding modules and a copy of the built page
"M2_data_extractor.theta_explorer" = ["*.js", "*.html"]
# the BASSA model explorer, `descripytor bassa_explorer`: its page, the example case and the two example tables
"M3_modeler.bassa_explorer" = ["*.html", "*.js", "*.csv"]
# the standalone vibration-mode viewer (python utils/mode_viewer.py --serve)
"utils" = ["*.html"]
# example protocol for the cluster pipeline
"M1_pre_calculations.pipeline" = ["examples/*.json", "examples/*.csv"]
"descripytor.examples" = [
    "*.json",
    "feather_example/*.feather",
    "feather_example/*.json",
    "feather_example/README.md",
    "baptiste_products/*.feather",
    "baptiste_products/*.csv",
    "baptiste_products/*.json",
    "baptiste_products/README.md",
]
