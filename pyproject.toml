[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "descripytor"
version = "0.1.0"
description = "Molecular feature extraction, alignment, and modeling tools."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eden Specktor", email = "edenspec@post.bgu.ac.il" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# numpy<2 is required: the RDKit and PyArrow builds used here fail against 2.x.
dependencies = [
    "numpy<2",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "plotly",
    "adjustText",
    "tqdm",
    "joblib",
    "psutil",
    "chardet",
    "igraph",
    "networkx",
    "rdkit",
    "morfeus-ml",
    "pillow",
    "flask",
    "flask-cors",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7", "ruff>=0.5", "twine>=5"]
# MolAlign atom renumbering
align = ["torch"]
# Streamlit extraction web app
webapp = ["streamlit", "umap-learn"]
# Extra descriptor engines in the extraction toolkit
engines = ["mordred", "deepchem", "ase"]
# Tkinter desktop GUI
gui = ["customtkinter"]
# Spike-and-slab / Bayesian extras in M3
bayes = ["pymc", "arviz"]
# SHAP explanations in model reports
explain = ["shap"]
# Jupyter notebooks
notebook = ["ipywidgets", "ipykernel", "dash"]

[project.scripts]
descripytor = "descripytor.cli:main"

[project.urls]
Homepage = "https://github.com/Milo-group/DescriPyTor"
Repository = "https://github.com/Milo-group/DescriPyTor"

[tool.setuptools]
include-package-data = true

# The package now lives at the repository root, so name the packages
# explicitly rather than globbing - otherwise the example and doc folders
# get swept into the distribution.
[tool.setuptools.packages.find]
include = [
    "descripytor*",
    "M1_pre_calculations*",
    "M2_data_extractor*",
    "M3_modeler*",
    "MolAlign*",
    "utils*",
]
exclude = ["runs*", "work*", "docs*", "Getting_started_with_examples*", "tests*"]

[tool.setuptools.package-data]
"M2_data_extractor" = ["*.html"]
"descripytor.examples" = [
    "*.json",
    "feather_example/*.feather",
    "feather_example/*.json",
    "feather_example/README.md",
    "baptiste_products/*.feather",
    "baptiste_products/*.csv",
    "baptiste_products/*.json",
    "baptiste_products/README.md",
]
