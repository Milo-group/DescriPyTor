<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DescriPytor — TS / vibration viewer</title>
  <script src="https://3dmol.org/build/3Dmol-min.js"></script>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --surface3: #2b3050;
      --border: #353a57; --accent: #5b8af5; --green: #3ecf8e; --red: #e05252;
      --yellow: #f0c040; --text: #e8eaf6; --text-dim: #8892b0; --text-muted: #4a5175;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px;
    }
    header {
      background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px; display: flex; align-items: center; gap: 14px;
    }
    .logo {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--green));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #fff;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    header p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    .layout {
      display: grid; grid-template-columns: 320px 1fr;
      height: calc(100vh - 69px);
    }
    aside {
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 16px; overflow: auto;
    }
    main { display: flex; flex-direction: column; min-width: 0; }
    #viewer {
      flex: 1; min-height: 360px; position: relative; background: #0d1117;
    }
    .toolbar {
      border-top: 1px solid var(--border); padding: 10px 16px;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: end;
      background: var(--surface);
    }
    label { font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 4px; }
    button, select, input[type=file] {
      font: inherit; color: var(--text); background: var(--surface2);
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .drop {
      border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 14px; text-align: center; color: var(--text-dim); font-size: 12px;
      margin-bottom: 12px; background: var(--surface2);
    }
    .drop.over { border-color: var(--accent); color: var(--text); }
    .verdict {
      border-radius: var(--radius); padding: 10px 12px; font-size: 12px; margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .verdict.ok { background: rgba(62,207,142,0.12); color: var(--green); }
    .verdict.bad { background: rgba(224,82,82,0.12); color: var(--red); }
    .verdict.muted { color: var(--text-dim); }
    .modes { display: flex; flex-direction: column; gap: 3px; max-height: calc(100vh - 360px); overflow: auto; }
    .mode {
      display: grid; grid-template-columns: 36px 1fr auto; gap: 6px; align-items: center;
      padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px;
      border: 1px solid transparent;
    }
    .mode:hover { background: var(--surface2); }
    .mode.sel { background: var(--surface3); border-color: var(--accent); }
    .mode.imag { color: var(--red); }
    .mode .idx { color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .badge {
      font-size: 10px; padding: 1px 6px; border-radius: 10px;
      background: var(--surface3); color: var(--text-dim);
    }
    .badge.imag { background: rgba(224,82,82,0.2); color: var(--red); }
    .badge.win { background: rgba(62,207,142,0.2); color: var(--green); }
    .meta { font-size: 11px; color: var(--text-muted); margin: 8px 0 12px; word-break: break-all; }
    .top { font-size: 12px; color: var(--text-dim); line-height: 1.45; }
    .top b { color: var(--text); }
    .field { min-width: 140px; flex: 1; }
    input[type=range] { width: 100%; }
    .placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px; color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">ν</div>
    <div>
      <h1>TS / vibration viewer</h1>
      <p>Structure + animated normal modes · one imaginary frequency is a saddle</p>
    </div>
  </header>
  <div class="layout">
    <aside>
      <div class="drop" id="drop">
        Drop <code>.hess</code>, ORCA <code>.out</code>, or <code>.xyz</code>
        <div style="margin-top:8px;"><input type="file" id="file" accept=".hess,.xyz,.out,.log,.txt" /></div>
      </div>
      <div id="verdict" class="verdict muted">Load a Hessian or NUMFREQ output to check imaginary modes.</div>
      <div class="meta" id="meta"></div>
      <label>Molecule</label>
      <select id="mol" style="width:100%;margin-bottom:10px;"></select>
      <label>Normal modes</label>
      <div class="modes" id="modes"></div>
    </aside>
    <main>
      <div id="viewer">
        <div class="placeholder" id="ph"><span style="font-size:36px;">⚛</span><span>Load a molecule</span></div>
      </div>
      <div class="toolbar">
        <div class="field">
          <label>Amplitude: <span id="ampv">0.45</span> Å</label>
          <input id="amp" type="range" min="0.05" max="1.2" step="0.05" value="0.45" />
        </div>
        <div class="field">
          <label>Speed: <span id="spdv">12</span> fps</label>
          <input id="spd" type="range" min="4" max="28" step="1" value="12" />
        </div>
        <button type="button" id="play" class="active">Pause</button>
        <button type="button" id="arrows" class="active">Hide arrows</button>
        <button type="button" id="recenter">Recenter</button>
        <div class="field" style="flex:1.4;">
          <div class="top" id="top"></div>
        </div>
      </div>
    </main>
  </div>
  <script type="application/json" id="boot">__DATA__</script>
  <script>
let BOOT = null;
try {
  BOOT = JSON.parse(document.getElementById('boot').textContent);
} catch (e) { BOOT = null; }
let molecules = (BOOT && BOOT.molecules) ? BOOT.molecules : [];
let current = null, selected = null, viewer = null, playing = true, showArrows = true;

const el = id => document.getElementById(id);
const fmt = (x, n=1) => Number(x).toFixed(n);

function apiParse(name, text) {
  return fetch('/api/parse-modes', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, text})
  }).then(r => r.json());
}

function parseXyzClient(name, text) {
  const lines = text.split(/\r?\n/);
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  const n = parseInt(lines[i], 10);
  if (!n) throw new Error('Not XYZ');
  const symbols = [], coords = [];
  for (let k = 0; k < n; k++) {
    const p = (lines[i + 2 + k] || '').trim().split(/\s+/);
    symbols.push(p[0]);
    coords.push([+p[1], +p[2], +p[3]]);
  }
  return {
    name, source: name, note: 'XYZ (client)', symbols, coords, n_atoms: n,
    n_imag: 0, ok: false, verdict: 'geometry only — need .hess or NUMFREQ .out for vibrations',
    default_mode: null, modes: [], traj: ''
  };
}

async function ingest(name, text) {
  let payload = null;
  try {
    payload = await apiParse(name, text);
    if (payload && payload.error) throw new Error(payload.error);
  } catch (err) {
    if (name.toLowerCase().endsWith('.xyz')) payload = parseXyzClient(name, text);
    else {
      el('verdict').className = 'verdict bad';
      el('verdict').textContent = 'Could not parse on this page. Run  python utils/mode_viewer.py "' + name + '" --open  or  python utils/mode_viewer.py --serve';
      return;
    }
  }
  const i = molecules.findIndex(m => m.name === payload.name);
  if (i >= 0) molecules[i] = payload; else molecules.push(payload);
  selected = null;
  fillMolSelect(payload.name);
  showMol(payload);
}

function fillMolSelect(selectName) {
  el('mol').innerHTML = molecules.map(m => `<option value="${m.name}">${m.name} · ${m.n_atoms} atoms</option>`).join('');
  if (selectName) el('mol').value = selectName;
}

function showMol(mol, modeN) {
  current = mol;
  if (mol.modes && mol.modes.length) {
    if (modeN != null) selected = mol.modes.find(m => m.n === modeN) || selected;
    else if (!selected || !mol.modes.some(m => selected && m.n === selected.n)) {
      selected = mol.modes.find(m => m.n === mol.default_mode) || mol.modes.find(m => m.imag) || mol.modes[0];
    }
  } else {
    selected = null;
  }
  el('verdict').className = 'verdict ' + (mol.ok ? 'ok' : (mol.modes && mol.modes.length ? 'bad' : 'muted'));
  el('verdict').textContent = mol.verdict;
  el('meta').textContent = (mol.note || '') + (mol.source ? '\n' + mol.source : '');
  el('modes').innerHTML = (mol.modes || []).map(m => {
    const cls = 'mode' + (m.imag ? ' imag' : '') + (selected && selected.n === m.n ? ' sel' : '');
    const badge = m.imag
      ? `<span class="badge imag">${m.window || 'imag'}</span>`
      : (Math.abs(m.f) < 10 ? `<span class="badge">trans/rot</span>` : '');
    return `<div class="${cls}" data-n="${m.n}"><span class="idx">${m.n}</span><span>${fmt(m.f,2)} cm⁻¹</span>${badge}</div>`;
  }).join('') || '<div class="meta">No modes in this file.</div>';
  el('modes').querySelectorAll('.mode').forEach(node => {
    node.onclick = () => showMol(current, +node.dataset.n);
  });
  render(true);
}

function xyzFrames(mol, mode) {
  const a = +el('amp').value, frames = 24;
  if (!mode) {
    let out = mol.symbols.length + '\n' + mol.name + '\n';
    for (let i = 0; i < mol.symbols.length; i++) {
      const c = mol.coords[i];
      out += `${mol.symbols[i]} ${c[0].toFixed(6)} ${c[1].toFixed(6)} ${c[2].toFixed(6)}\n`;
    }
    return out;
  }
  let out = '';
  for (let f = 0; f < frames; f++) {
    const phase = Math.sin(2 * Math.PI * f / frames);
    out += mol.symbols.length + '\n' + mol.name + ' mode ' + mode.n + '\n';
    for (let i = 0; i < mol.symbols.length; i++) {
      const c = mol.coords[i], v = mode.v[i];
      out += `${mol.symbols[i]} ${(c[0] + a * phase * v[0]).toFixed(6)} ${(c[1] + a * phase * v[1]).toFixed(6)} ${(c[2] + a * phase * v[2]).toFixed(6)}\n`;
    }
  }
  return out;
}

function addArrows(mol, mode) {
  if (!showArrows || !mode || !viewer) return;
  const a = +el('amp').value;
  for (let i = 0; i < mol.symbols.length; i++) {
    const c = mol.coords[i], v = mode.v[i];
    const amp = Math.hypot(v[0], v[1], v[2]);
    if (amp < 0.08) continue;
    viewer.addArrow({
      start: {x: c[0], y: c[1], z: c[2]},
      end: {x: c[0] + a * v[0], y: c[1] + a * v[1], z: c[2] + a * v[2]},
      radius: 0.04, radiusRatio: 2, mid: 0.75,
      color: mode.imag ? '#e05252' : '#5b8af5'
    });
  }
}

function render(recenter) {
  el('ampv').textContent = fmt(+el('amp').value, 2);
  el('spdv').textContent = el('spd').value;
  if (!current) return;
  el('ph').style.display = 'none';
  if (!window.$3Dmol) { el('top').textContent = '3Dmol.js failed to load'; return; }
  if (!viewer) viewer = $3Dmol.createViewer(el('viewer'), {backgroundColor: '#0d1117'});
  viewer.stopAnimate();
  viewer.removeAllModels();
  viewer.removeAllShapes();
  const src = (current.traj && !selected) ? current.traj : xyzFrames(current, selected);
  viewer.addModelsAsFrames(src, 'xyz');
  viewer.setStyle({}, {stick: {radius: 0.12}, sphere: {scale: 0.26}});
  addArrows(current, selected);
  if (recenter) viewer.zoomTo();
  viewer.render();
  if (playing && (selected || current.traj)) {
    viewer.animate({loop: 'backAndForth', reps: 0, interval: Math.round(1000 / +el('spd').value)});
  }
  if (selected) {
    const tops = (selected.top || []).map(t => `#${t.i} ${t.elem} (${t.amp})`).join(' · ');
    el('top').innerHTML = `<b>mode ${selected.n}</b> ${fmt(selected.f,2)} cm⁻¹`
      + (selected.imag ? ' · imaginary' : '')
      + (selected.window ? ` · ${selected.window}` : '')
      + (tops ? `<br>largest motion: ${tops}` : '');
  } else {
    el('top').textContent = current.traj ? 'XYZ / IRC trajectory' : 'static geometry';
  }
}

el('file').onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  f.text().then(t => ingest(f.name, t));
};
['dragover','dragenter'].forEach(ev => el('drop').addEventListener(ev, e => { e.preventDefault(); el('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => el('drop').addEventListener(ev, e => { e.preventDefault(); el('drop').classList.remove('over'); }));
el('drop').addEventListener('drop', e => {
  const f = e.dataTransfer.files[0]; if (!f) return;
  f.text().then(t => ingest(f.name, t));
});
el('mol').onchange = () => { selected = null; showMol(molecules.find(m => m.name === el('mol').value)); };
el('amp').oninput = () => render(false);
el('spd').oninput = () => render(false);
el('play').onclick = () => {
  playing = !playing;
  el('play').classList.toggle('active', playing);
  el('play').textContent = playing ? 'Pause' : 'Play';
  render(false);
};
el('arrows').onclick = () => {
  showArrows = !showArrows;
  el('arrows').classList.toggle('active', showArrows);
  el('arrows').textContent = showArrows ? 'Hide arrows' : 'Show arrows';
  render(false);
};
el('recenter').onclick = () => render(true);

if (molecules.length) {
  fillMolSelect(molecules[0].name);
  showMol(molecules[0]);
}
  </script>
</body>
</html>
