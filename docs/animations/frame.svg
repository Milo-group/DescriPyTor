<text x="28.0" y="336.0" font-size="13" fill="#12a5a5" text-anchor="start" font-weight="600">1.  pick three groups of atoms</text>
<text x="28.0" y="356.0" font-size="12" fill="#a7b0bd" text-anchor="start" font-weight="normal">origin set (teal) · y-atom (violet) · plane atom (orange)</text>
<circle cx="244.8" cy="134.2" r="13" fill="none" stroke="#12a5a5" stroke-width="1.6" opacity=".8"/>
<circle cx="198.8" cy="178.6" r="13" fill="none" stroke="#12a5a5" stroke-width="1.6" opacity=".8"/>
<circle cx="214.3" cy="240.6" r="13" fill="none" stroke="#12a5a5" stroke-width="1.6" opacity=".8"/>
<circle cx="321.8" cy="213.8" r="13" fill="none" stroke="#9b7bf0" stroke-width="1.6" opacity=".8"/>
<circle cx="352.8" cy="77.8" r="14" fill="none" stroke="#e87d35" stroke-width="1.6" opacity=".8"/>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2250;0.2444;0.4444;0.4639;1.0000" dur="18.0s" repeatCount="indefinite"/>
