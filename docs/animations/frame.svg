<line x1="219.3" y1="184.5" x2="238.3" y2="118.1" stroke="#12a5a5" stroke-width="2.6" marker-end="url(#ah)" stroke-linecap="round"/>
<text x="234.3" y="138.1" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#12a5a5" text-anchor="start" font-weight="600">x̂</text>
<text x="28.0" y="336.0" font-size="13" fill="#12a5a5" text-anchor="start" font-weight="600">4.  strip the y-component off c — what is left is x</text>
<text x="28.0" y="358.0" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#a7b0bd" text-anchor="start" font-weight="normal">x̂ = normalize( c − (c·ŷ) ŷ )        ẑ = x̂ × ŷ</text>
</g>
