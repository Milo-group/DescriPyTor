<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Animation: the origin is the centroid of the chosen atoms, y points at the y-atom, and x is what remains of the plane atom after its y-component is removed.">
<title>Building a common reference frame</title>
<desc>Animation: the origin is the centroid of the chosen atoms, y points at the y-atom, and x is what remains of the plane atom after its y-component is removed.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<rect width="780" height="400" fill="none"/>
<text x="28.0" y="40.0" font-size="17" fill="#7d8797" text-anchor="start" font-weight="600">A common reference frame</text>
<text x="28.0" y="62.0" font-size="12.5" fill="#a7b0bd" text-anchor="start" font-weight="normal">Descriptors only compare across a series if every molecule sits in the same frame.</text>
<g>
