<line x1="219.3" y1="184.5" x2="303.3" y2="208.5" stroke="#9b7bf0" stroke-width="2.4" marker-end="url(#ah)" stroke-linecap="round"/>
<line x1="219.3" y1="184.5" x2="238.3" y2="118.1" stroke="#12a5a5" stroke-width="2.4" marker-end="url(#ah)" stroke-linecap="round"/>
<circle cx="219.3" cy="184.5" r="5.5" fill="none" stroke="#2fa46a" stroke-width="2.2"/>
<circle cx="219.3" cy="184.5" r="1.8" fill="#2fa46a"/>
<text x="199.3" y="172.5" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#2fa46a" text-anchor="start" font-weight="600">ẑ</text>
<text x="28.0" y="336.0" font-size="13" fill="#2fa46a" text-anchor="start" font-weight="600">5.  every atom re-expressed in that frame</text>
<text x="28.0" y="358.0" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#a7b0bd" text-anchor="start" font-weight="normal">r′ = B (r − o),   B = [ x̂ ; ŷ ; ẑ ]</text>
</g>
