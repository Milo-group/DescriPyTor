<circle cx="219.3" cy="184.5" r="11" fill="none" stroke="#7d8797" stroke-width="1" opacity=".5"/>
<text x="234.3" y="189.5" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#7d8797" text-anchor="start" font-weight="normal">o</text>
<text x="28.0" y="336.0" font-size="13" fill="#12a5a5" text-anchor="start" font-weight="600">2.  origin = centroid of the origin set</text>
<text x="28.0" y="358.0" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#a7b0bd" text-anchor="start" font-weight="normal">o = (r₂ + r₃ + r₄) / 3        rᵢ → rᵢ − o</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4361;0.4556;0.6333;0.6528;1.0000" dur="18.0s" repeatCount="indefinite"/>
<line x1="219.3" y1="184.5" x2="303.3" y2="208.5" stroke="#9b7bf0" stroke-width="2.4" marker-end="url(#ah)" stroke-linecap="round"/>
<text x="311.3" y="204.5" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#9b7bf0" text-anchor="start" font-weight="600">ŷ</text>
<text x="28.0" y="336.0" font-size="13" fill="#9b7bf0" text-anchor="start" font-weight="600">3.  the y axis points at the y-atom</text>
<text x="28.0" y="358.0" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#a7b0bd" text-anchor="start" font-weight="normal">ŷ = (r_y − o) / ‖r_y − o‖</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6250;0.6444;0.8556;0.8750;1.0000" dur="18.0s" repeatCount="indefinite"/>
<line x1="219.3" y1="184.5" x2="303.3" y2="208.5" stroke="#9b7bf0" stroke-width="2.0" marker-end="url(#ah)" stroke-linecap="round"/>
